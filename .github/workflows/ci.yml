name: CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Verify backend with real dependencies
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-backend.sh 2>&1 | tee backend-verification.log
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:contract
        working-directory: frontend
      - name: Start backend and validate live contract
        run: |
          java -jar backend/admin-starter/target/admin-starter-1.0.0.jar --spring.profiles.active=local > /tmp/shop-admin.log 2>&1 &
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/shop-admin.log; exit 1; fi
          bash scripts/export-contract.sh
          git diff --exit-code -- docs/openapi.json frontend/src/api/schema.d.ts
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Build deployment images
        run: |
          docker build -t shop-admin-backend:test backend
          docker build -t shop-admin-frontend:test frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/site/jacoco/
            backend/**/target/site/jacoco-aggregate/
            backend-verification.log
            frontend/playwright-report
            frontend/test-results/
            /tmp/shop-admin.log
          retention-days: 14
          if-no-files-found: warn
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    needs: verify
    timeout-minutes: 15
    environment: staging
    runs-on: [self-hosted, staging]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Read workflow creation time
        id: timing
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            core.setOutput('created_at', data.created_at);
      - name: Deploy tested revision
        env:
          APP_VERSION: ${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          COMPOSE_PROJECT_NAME: shop-admin-staging
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          : "${STAGING_URL:?Set the STAGING_URL repository variable}"
          bash scripts/deploy.sh
          curl --fail --silent --show-error --max-time 10 "${STAGING_URL%/}/" >/dev/null
          status=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "${STAGING_URL%/}/api/auth/me")
          test "$status" = 401
      - name: Verify end-to-end delivery budget
        env:
          WORKFLOW_CREATED_AT: ${{ steps.timing.outputs.created_at }}
        run: python3 scripts/check-delivery-time.py "$WORKFLOW_CREATED_AT"
