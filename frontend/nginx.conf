server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 # Docker may assign a new IP after a backend restart. Re-resolve its service name.
 resolver 127.0.0.11 valid=5s ipv6=off;
 resolver_timeout 2s;
 set $backend http://backend:8080;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass $backend; proxy_connect_timeout 5s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 location / { try_files $uri $uri/ /index.html; }
}
